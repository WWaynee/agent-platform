# ========================================
# 多租户智能 Agent 工作台 - Nginx 反向代理参考配置
# 前端为纯静态文件（web/ 目录），/api 反代到后端 Gin 服务（默认 8080）。
# 用法：把 web/ 挂到 root 目录，将此配置放入 nginx conf（或 /etc/nginx/conf.d/）。
# ========================================

server {
    listen 80;
    server_name _;

    # 前端静态文件目录（把仓库 web/ 目录复制/挂载到这里）
    root /usr/share/nginx/html/web;
    index login.html;

    # API 反向代理到后端 Gin（Gin 默认 SERVER_HTTP_PORT=8080）
    # 用 ^~ 提升 /api 优先级，避免被下方正则静态 location 截获（防止 .js/.css 结尾的 API 路径被当静态文件）
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传文档最大 10MB（后端限制），Nginx 需同步放大与超时
        client_max_body_size 10m;
        proxy_read_timeout 300s;   # 对话接口走 LLM 可能较慢，放宽读超时
        proxy_send_timeout 60s;
    }

    # 健康检查（后端 /health 无 /api 前缀）
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    # 静态资源缓存（可选）
    location ~* \.(css|js|png|jpg|svg|ico)$ {
        expires 1d;
        add_header Cache-Control "public";
    }
}
