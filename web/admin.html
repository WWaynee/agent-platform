<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <title>管理后台 · 多租户智能 Agent</title>
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- toast 容器 -->
  <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

  <!-- 顶部栏 -->
  <header class="bg-white border-b border-gray-200 h-14 flex items-center px-4 shadow-sm">
    <button onclick="window.location.href='/index.html'" class="text-gray-500 hover:text-indigo-600 mr-4">
      <i class="fa-solid fa-arrow-left"></i><span class="ml-1 text-sm">返回工作台</span>
    </button>
    <div class="font-bold text-gray-800"><i class="fa-solid fa-sliders mr-1"></i>管理后台</div>
    <div class="flex-1"></div>
    <div class="text-sm text-gray-500" id="adminIdentity"></div>
    <button onclick="logout()" class="ml-4 text-gray-400 hover:text-red-500">
      <i class="fa-solid fa-right-from-bracket"></i><span class="ml-1 hidden sm:inline">退出</span>
    </button>
  </header>

  <div class="p-6 max-w-5xl mx-auto space-y-6">
    <!-- 用量统计 -->
    <section class="bg-white rounded-xl shadow-sm p-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-4"><i class="fa-solid fa-chart-simple text-indigo-500 mr-2"></i>Token 用量统计</h2>
      <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="bg-indigo-50 rounded-lg p-4 text-center">
          <div class="text-xs text-gray-500 mb-1">今日 Token</div>
          <div class="text-2xl font-bold text-indigo-600" id="todayTokens">--</div>
        </div>
        <div class="bg-purple-50 rounded-lg p-4 text-center">
          <div class="text-xs text-gray-500 mb-1">今日调用次数</div>
          <div class="text-2xl font-bold text-purple-600" id="todayCalls">--</div>
        </div>
        <div class="bg-green-50 rounded-lg p-4 text-center">
          <div class="text-xs text-gray-500 mb-1">统计周期</div>
          <div class="text-2xl font-bold text-green-600" id="usageDays">--</div>
        </div>
      </div>
      <div class="text-sm text-gray-500 mb-2">最近 7 天 Token 用量趋势</div>
      <div id="usageBars"></div>
    </section>

    <!-- 员工管理：管理员为当前租户创建普通用户 -->
    <section class="bg-white rounded-xl shadow-sm p-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-2"><i class="fa-solid fa-user-plus text-green-500 mr-2"></i>员工管理</h2>
      <p class="text-xs text-gray-400 mb-4">为当前租户创建普通成员（员工）。员工登录只需用户名 + 密码；用户名全局唯一，且员工为普通成员（member），不具备管理员权限。</p>
      <div class="grid sm:grid-cols-3 gap-3">
        <div>
          <label class="block text-sm text-gray-600 mb-1">用户名</label>
          <input id="empUsername" type="text" class="input-field" placeholder="员工用户名（2-64位，全局唯一）" />
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">密码</label>
          <input id="empPassword" type="password" class="input-field" placeholder="至少 6 位" />
        </div>
        <div class="flex items-end">
          <button onclick="createEmployee()" class="w-full bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-lg font-medium">
            <i class="fa-solid fa-user-plus mr-1"></i>创建员工
          </button>
        </div>
      </div>
      <p id="empResult" class="mt-3 text-sm"></p>
    </section>

    <!-- 工具配置 -->
    <section class="bg-white rounded-xl shadow-sm p-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-2"><i class="fa-solid fa-wand-magic-sparkles text-purple-500 mr-2"></i>Agent 工具配置</h2>
      <p class="text-xs text-gray-400 mb-4">控制本租户内 Agent 可调用的工具开关。关闭后，对话中 Agent 无法调用该工具。</p>
      <div id="toolList"></div>
    </section>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script>
    // 管理后台仅管理员可访问：非 admin 直接跳回工作台
    if (!requireAuth()) { /* 已跳登录 */ }
    else {
      const u = getUser();
      if (!u || u.Role !== 'admin') {
        alert('无权访问管理后台（仅管理员）');
        window.location.href = '/index.html';
      } else {
        document.getElementById('adminIdentity').textContent = u.Username + (getTenantName() ? (' · ' + getTenantName()) : '');
        loadTools();
        loadUsage();
      }
    }
  </script>
</body>
</html>
